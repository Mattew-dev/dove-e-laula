<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dov'è l'aula?</title>
  <meta name="description" content="Cerca un'aula del campus Unical di Arcavacata e scopri in che cubo si trova e come arrivarci.">
  <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dov'è l'aula">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applica il tema salvato prima del primo disegno, per evitare il lampo chiaro/scuro.
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <header class="testata">
    <a href="#/" class="logo" aria-label="Dov'è l'aula? Torna all'inizio">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
      <span>Dov'è l'aula?</span>
    </a>
    <button type="button" class="tema" id="tema" aria-label="Cambia tema"></button>
  </header>

  <form class="cerca" role="search" id="form-cerca" autocomplete="off">
    <label for="q" class="nascosto">Cerca un'aula</label>
    <svg class="lente" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <input id="q" name="q" type="search" placeholder="Aula, codice o vecchio nome" enterkeyhint="search" autocapitalize="characters" spellcheck="false">
    <button type="button" class="svuota" id="svuota" aria-label="Cancella la ricerca" hidden>×</button>
  </form>

  <div class="offline" id="offline" hidden>Sei offline: la ricerca funziona, la mappa potrebbe non caricarsi.</div>

  <main id="vista" tabindex="-1" aria-live="polite">
    <p class="caricamento">Carico l'elenco delle aule…</p>
  </main>
</body>
</html>
